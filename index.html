<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>自作ナビ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;font-size:15px}
#map{position:absolute;top:0;left:0;right:0;height:55%}
#panel{position:absolute;top:55%;bottom:0;left:0;right:0;overflow:auto;padding:8px 10px;background:#fafafa;border-top:1px solid #ccc}
@media (min-width:900px){
  #map{height:auto;bottom:0;right:400px}
  #panel{top:0;left:auto;width:400px;border-top:none;border-left:1px solid #ccc}
}
button,select,input{font-size:15px;padding:6px 10px;margin:3px 3px 3px 0}
#search{width:55%}
#next{font-size:21px;font-weight:bold;margin:2px 0}
#summary{font-size:16px;margin:2px 0}
#exitInfo{font-size:15px;color:#1f3a93;font-weight:bold;margin:2px 0 4px}
#hwy{display:none;background:#fff;border:2px solid #2e7d32;border-radius:8px;padding:4px 8px;margin:6px 0}
.fac{display:flex;align-items:baseline;gap:6px;padding:3px 0;border-bottom:1px solid #eee;font-size:15px}
.fac:last-child{border-bottom:none}
.fac .t{flex:none;min-width:34px;text-align:center;border-radius:4px;color:#fff;font-size:12px;font-weight:bold;padding:1px 3px}
.fac .n{flex:1;font-weight:bold}
.fac .d{flex:none;text-align:right;white-space:nowrap}
.jam{color:#c0392b;font-size:12px;padding:0 0 2px 40px}
#banner{display:none;background:#fff3cd;border:2px solid #e0a800;border-radius:8px;padding:8px;margin:6px 0;font-size:16px}
#verdict{background:#e8f0fe;border:2px solid #1f3a93;border-radius:8px;padding:8px;margin:6px 0;font-size:16px;font-weight:bold}
#judgeBtn{background:#1f3a93;color:#fff;border:none;border-radius:6px}
.card{border:1px solid #ccc;border-radius:6px;padding:6px 8px;margin:6px 0;background:#fff;line-height:1.6}
.cur{border:2px solid #1f3a93}
.inc{color:#8e44ad}
.small{color:#777;font-size:12px}
.hit{padding:8px;border-bottom:1px solid #ddd;cursor:pointer;background:#fff}
details{margin:8px 0;background:#fff;border:1px solid #ddd;border-radius:6px;padding:6px}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div id="next">目的地を設定してください</div>
  <div id="summary"></div>
  <div id="exitInfo"></div>
  <div id="hwy"></div>
  <div id="banner">
    <div id="bannerText"></div>
    <button id="switchBtn">切り替える</button><button id="ignoreBtn">今回は見送る</button>
  </div>
  <div>
    <button id="start" disabled>ナビ開始</button><button id="stop" disabled>停止</button><button id="judgeBtn">判定</button><button id="followBtn">追従：ON</button>
  </div>
  <div>
    <input id="search" placeholder="目的地（住所・駅名など）"><button id="searchBtn">検索</button><button id="pickBtn">地図で指定</button>
  </div>
  <div id="hits"></div>
  <div id="guide" class="small">現在地を取得中…</div>
  <div id="judgeOut"></div>
  <div id="incs"></div>
  <div id="cands"></div>
  <div class="small">
    提案する差：<select id="thr"><option>2</option><option selected>3</option><option>5</option><option>10</option></select>分以上
    　確認間隔：<select id="interval"><option>1</option><option selected>2</option><option>3</option><option>5</option></select>分<br>
    遠回り1km＝<select id="wkm"><option>0</option><option>0.5</option><option selected>1</option><option>2</option></select>分の損とみなす
  </div>
  <details>
    <summary>出口（IC）の登録</summary>
    <div class="small">出口は地図データから自動で拾いますが、確実にしたい出口は登録できます。「出口を登録」を押し、<b>料金所を出た先の一般道</b>をタップして名前を付けてください。</div>
    <button id="icAddBtn">出口を登録</button>
    <div id="icList"></div>
    <div class="small">端末間で移すとき：書き出し → 文字をコピー → 別の端末に貼って読み込み</div>
    <textarea id="icText" rows="3" style="width:100%"></textarea>
    <button id="icExport">書き出し</button><button id="icImport">読み込み</button>
  </details>
  <div class="small"><span id="status"></span>　<span id="counter">API利用 0回</span></div>
  <div id="err" class="small" style="color:#c00"></div>
  <div class="small">出口データ © OpenStreetMap contributors</div>
</div>
<script>
// ▼▼▼ ここにトークンを貼る（pk. で始まる文字列） ▼▼▼
const TOKEN = 'pk.eyJ1IjoiaG9yaWhha28iLCJhIjoiY211djd0ejljMDA5ZjMycHYxaTY3M3BsdSJ9.a1yefJYynC4k_YvllM5DVw';
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

mapboxgl.accessToken = TOKEN;
const map = new mapboxgl.Map({
  container: 'map', style: 'mapbox://styles/mapbox/standard',
  center: [139.33, 35.62], zoom: 11, language: 'ja'
});
map.addControl(new mapboxgl.NavigationControl(), 'top-right');

const $ = id => document.getElementById(id);
const COLORS = {low:'#2ecc71', moderate:'#f1c40f', heavy:'#e67e22', severe:'#c0392b', unknown:'#5dade2'};
const INC = {accident:'事故', congestion:'渋滞', construction:'工事', disabled_vehicle:'故障車',
  lane_restriction:'車線規制', road_closure:'通行止め', road_hazard:'路上障害物', weather:'気象',
  planned_event:'イベント', mass_transit:'公共交通', other_news:'その他', miscellaneous:'その他'};
const MAX_REQ = 400;

let reqCount = 0, pos = null, speed = null, dest = null, destMarker = null, posMarker = null;
let pickMode = false, icPick = false, navOn = false, follow = true, active = null, proposal = null;
let offCount = 0, busy = false, judging = false, lastJudge = 0, timer = null, wakeLock = null;
let preferGeneral = false;
let viaEntry = null, entryPending = false; // 選んだ入口（IC）／ナビ開始後に入口の比較を行う印
const spoken = new Set(), spokenInc = new Set(), spokenFac = new Set(), ignored = {};
let ics = [];
try { ics = JSON.parse(localStorage.getItem('navi_ics') || '[]'); } catch (e) { ics = []; }

// ---------- 共通 ----------
function showErr(m) {
  const t = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
  $('err').innerHTML = `<div>${t} ${m}</div>` + $('err').innerHTML.split('</div>').slice(0, 2).join('</div>');
}
function speak(t) {
  try { const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
function setData(id, f) { const s = map.getSource(id); if (s) s.setData({type:'FeatureCollection', features:f}); }
function hhmm(sec) { return new Date(Date.now() + sec * 1000).toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}); }
function fmtDist(m) { return m >= 1000 ? (m / 1000).toFixed(1) + 'km' : Math.max(0, Math.round(m / 50) * 50) + 'm'; }
const fmtKm = v => (v >= 0 ? '+' : '') + v.toFixed(1) + 'km';
const sgn = v => (v > 0 ? '+' : '') + v;
const wkm = () => Number($('wkm').value);
async function keepAwake() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (navOn && document.visibilityState === 'visible') keepAwake(); });

// ---------- 距離・方角の計算 ----------
function distM(a, b) {
  const r = Math.PI / 180, x = (b[0] - a[0]) * r * Math.cos((a[1] + b[1]) / 2 * r), y = (b[1] - a[1]) * r;
  return Math.sqrt(x * x + y * y) * 6371000;
}
function segDist(p, a, b) {
  const k = Math.cos(p[1] * Math.PI / 180) * 111320, m = 110540;
  const ax = (a[0] - p[0]) * k, ay = (a[1] - p[1]) * m, bx = (b[0] - p[0]) * k, by = (b[1] - p[1]) * m;
  const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
  let t = L ? -(ax * dx + ay * dy) / L : 0; t = Math.max(0, Math.min(1, t));
  const x = ax + t * dx, y = ay + t * dy;
  return {d: Math.sqrt(x * x + y * y), t};
}
function nearest(coords, p) {
  let best = {d: 1e12, i: 0, t: 0};
  for (let i = 0; i < coords.length - 1; i++) {
    const s = segDist(p, coords[i], coords[i + 1]);
    if (s.d < best.d) best = {d: s.d, i, t: s.t};
  }
  return best;
}
function along(c, p) {
  const n = nearest(c.coords, p), a = c.cum[n.i], b = c.cum[n.i + 1];
  return b === undefined ? a : a + n.t * (b - a);
}
function bearing(a, b) { const k = Math.cos(a[1] * Math.PI / 180); return Math.atan2((b[0] - a[0]) * k, b[1] - a[1]) * 180 / Math.PI; }
function offsetPt(p, brg, d) {
  const k = Math.cos(p[1] * Math.PI / 180) * 111320, m = 110540, r = brg * Math.PI / 180;
  return [p[0] + Math.sin(r) * d / k, p[1] + Math.cos(r) * d / m];
}
const totalOf = c => c.cum[c.cum.length - 1];
const remDist = c => pos ? Math.max(0, totalOf(c) - along(c, pos)) : totalOf(c);
// 道のりの位置 a までにかかる時間（秒）。区間ごとの所要時間があればそれで、なければ距離の割合で
function timeAt(c, a) {
  const T = totalOf(c); if (!T) return 0;
  if (!c.ct) return c.r.duration * Math.min(a, T) / T;
  let lo = 0, hi = c.cum.length - 1;
  if (a <= 0) return 0; if (a >= T) return c.ct[hi];
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (c.cum[m] <= a) lo = m; else hi = m; }
  const s = c.cum[hi] - c.cum[lo];
  return c.ct[lo] + (s ? (a - c.cum[lo]) / s : 0) * (c.ct[hi] - c.ct[lo]);
}
const remDur = c => totalOf(c) ? timeAt(c, totalOf(c)) - (pos ? timeAt(c, along(c, pos)) : 0) : 0;
function jamAhead(c) {
  const n = pos ? nearest(c.coords, pos).i : 0; let j = 0;
  for (let i = n; i < c.coords.length - 1; i++) {
    const g = c.cong[i]; if (g === 'heavy' || g === 'severe') j += c.cum[i + 1] - c.cum[i];
  }
  return j;
}
function sameAs(c, base) {
  if (!base || base.coords.length < 2) return false;
  const pts = c.coords, step = Math.max(1, Math.floor(pts.length / 40)); let hit = 0, n = 0;
  for (let i = 0; i < pts.length; i += step) { n++; if (nearest(base.coords, pts[i]).d < 40) hit++; }
  return hit / n >= 0.85;
}
// 実質の得（分）：時間の短縮 − 遠回り距離×設定値
function scoreGain(c) { return (remDur(active) - remDur(c)) / 60 - wkm() * (remDist(c) - remDist(active)) / 1000; }
// 高速道路かどうか
const isMwStep = s => (s.intersections || []).some(x => (x.classes || []).includes('motorway'));
function curStepIdx(my) {
  for (let s = 1; s < active.steps.length; s++) if (active.manAlong[s] > my + 5) return s - 1;
  return Math.max(0, active.steps.length - 1);
}
function firstExitAlong(c) {
  const st = (c.r.legs[0] && c.r.legs[0].steps) || [];
  for (let i = 1; i < st.length; i++) {
    if (isMwStep(st[i - 1]) && !isMwStep(st[i]))
      return {a: along(c, st[i].maneuver.location), txt: st[i - 1].maneuver.instruction || st[i].maneuver.instruction || ''};
  }
  return null;
}
function earlyExit(c, my) {
  const ce = firstExitAlong(c); if (!ce) return null;
  const ae = firstExitAlong(active);
  const activeExit = ae ? ae.a - my : totalOf(active) - my;
  return ce.a < activeExit - 1000 ? (ce.txt || '途中の出口') : null;
}
// この先にある登録済み出口（ルートから1.5km以内）
function exitsAhead(my) {
  if (!active) return [];
  return ics.map(ic => { const n = nearest(active.coords, ic.p); return {ic, off: n.d, a: active.cum[n.i] - my}; })
    .filter(x => x.off < 1500 && x.a > 100).sort((a, b) => a.a - b.a);
}
// この先の最初の渋滞区間（15km以内）
function jamSpan(my) {
  const c = active; let i1 = -1;
  for (let i = 0; i < c.coords.length - 1; i++) {
    if (c.cum[i] < my) continue; if (c.cum[i] > my + 15000) break;
    const g = c.cong[i]; if (g === 'heavy' || g === 'severe') { i1 = i; break; }
  }
  if (i1 < 0) return null;
  let i2 = i1, gap = 0;
  for (let i = i1 + 1; i < c.coords.length - 1; i++) {
    const g = c.cong[i];
    if (g === 'heavy' || g === 'severe') { i2 = i; gap = 0; } else if (++gap > 5) break;
  }
  if (c.cum[i2 + 1] - c.cum[i1] < 300) return null;
  return {i1, i2: i2 + 1};
}

// ---------- 地図の準備 ----------
map.on('load', () => {
  map.addSource('traffic', {type:'vector', url:'mapbox://mapbox.mapbox-traffic-v1'});
  map.addLayer({id:'traffic', type:'line', source:'traffic', 'source-layer':'traffic', paint:{
    'line-width':['interpolate',['linear'],['zoom'],8,1.5,14,4],
    'line-color':['match',['get','congestion'],'low',COLORS.low,'moderate',COLORS.moderate,'heavy',COLORS.heavy,'severe',COLORS.severe,'#999'],
    'line-opacity':0.85}});
  const empty = {type:'FeatureCollection', features:[]};
  ['casing', 'seg', 'prop', 'inc', 'ics'].forEach(id => map.addSource(id, {type:'geojson', data:empty}));
  map.addLayer({id:'prop', type:'line', source:'prop', layout:{'line-cap':'round'},
    paint:{'line-color':'#8e44ad', 'line-width':6, 'line-dasharray':[1.5, 1]}});
  map.addLayer({id:'casing', type:'line', source:'casing', layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':'#1f3a93', 'line-width':11}});
  map.addLayer({id:'seg', type:'line', source:'seg', layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':['get','color'], 'line-width':5}});
  map.addLayer({id:'inc', type:'circle', source:'inc',
    paint:{'circle-radius':9, 'circle-color':'#8e44ad', 'circle-stroke-color':'#fff', 'circle-stroke-width':2}});
  map.addLayer({id:'ics', type:'circle', source:'ics',
    paint:{'circle-radius':7, 'circle-color':'#ff8c00', 'circle-stroke-color':'#fff', 'circle-stroke-width':2}});
  map.addLayer({id:'icsLabel', type:'symbol', source:'ics',
    layout:{'text-field':['get','name'], 'text-size':12, 'text-offset':[0, 1.3]},
    paint:{'text-color':'#b35900', 'text-halo-color':'#fff', 'text-halo-width':1.5}});
  renderIcs();
});
map.on('error', e => showErr('地図エラー：' + (e.error && e.error.message ? e.error.message : '不明')));
map.on('dragstart', () => { if (navOn) { follow = false; $('followBtn').textContent = '追従：OFF'; } });
map.on('click', e => {
  const p = [e.lngLat.lng, e.lngLat.lat];
  if (icPick) {
    icPick = false;
    const name = prompt('出口の名前（例：上野原IC）');
    if (name && name.trim()) { ics.push({name: name.trim(), p}); saveIcs(); $('guide').textContent = name.trim() + 'を登録しました。'; }
    return;
  }
  if (pickMode) { pickMode = false; setDest(p); }
});

// ---------- 出口の登録 ----------
function saveIcs() {
  try { localStorage.setItem('navi_ics', JSON.stringify(ics)); } catch (e) { showErr('出口の保存に失敗しました'); }
  renderIcs();
}
function renderIcs() {
  $('icList').innerHTML = ics.length
    ? ics.map((ic, i) => `<div>${ic.name}　<button data-del="${i}">削除</button></div>`).join('')
    : '<div class="small">まだ登録がありません</div>';
  $('icList').querySelectorAll('button').forEach(b => b.onclick = () => {
    const i = Number(b.dataset.del);
    if (confirm(ics[i].name + 'を削除しますか？')) { ics.splice(i, 1); saveIcs(); }
  });
  setData('ics', ics.map(ic => ({type:'Feature', properties:{name: ic.name}, geometry:{type:'Point', coordinates: ic.p}})));
}
$('icAddBtn').onclick = () => { icPick = true; pickMode = false; $('guide').textContent = '料金所を出た先の一般道をタップしてください。'; };
$('icExport').onclick = () => { $('icText').value = JSON.stringify(ics); };
$('icImport').onclick = () => {
  try {
    const a = JSON.parse($('icText').value);
    if (!Array.isArray(a)) throw 0;
    ics = a.filter(x => x && x.name && Array.isArray(x.p)); saveIcs();
    $('guide').textContent = '出口データを読み込みました。';
  } catch (e) { showErr('読み込めない形式です'); }
};

// ---------- 現在地 ----------
if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(onPos, e => showErr('位置情報エラー：' + e.message),
    {enableHighAccuracy: true, maximumAge: 2000, timeout: 20000});
} else showErr('この端末では位置情報が使えません');

function onPos(p) {
  pos = [p.coords.longitude, p.coords.latitude]; speed = p.coords.speed;
  if (!posMarker) {
    const el = document.createElement('div');
    el.style.cssText = 'width:18px;height:18px;border-radius:50%;background:#1e90ff;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5)';
    posMarker = new mapboxgl.Marker({element: el}).setLngLat(pos).addTo(map);
    if (!navOn) map.jumpTo({center: pos, zoom: 13});
    if (!dest) $('guide').textContent = '目的地を検索するか、「地図で指定」を押して地図をタップしてください。';
  } else posMarker.setLngLat(pos);
  if (navOn && follow) map.easeTo({center: pos, duration: 800});
  if (navOn && active) guide();
}

// ---------- 目的地 ----------
$('pickBtn').onclick = () => { pickMode = true; icPick = false; $('guide').textContent = '地図上の目的地をタップしてください。'; };
// 目的地の検索：まず施設・駅も探せる検索（Search Box）、だめなら住所の検索（Geocoding）
async function searchPlaces(q) {
  const prox = pos ? `&proximity=${pos[0].toFixed(5)},${pos[1].toFixed(5)}` : '';
  const qs = `q=${encodeURIComponent(q)}&country=jp&language=ja&limit=7${prox}&access_token=${TOKEN}`;
  let feats = [];
  try {
    const r = await fetch('https://api.mapbox.com/search/searchbox/v1/forward?' + qs);
    const j = await r.json();
    if (!r.ok) throw new Error(`HTTP ${r.status} ${j.message || ''}`);
    feats = (j.features || []).map(f => ({p: f.geometry.coordinates, name: f.properties.name || '',
      sub: f.properties.full_address || f.properties.place_formatted || '', poi: f.properties.feature_type === 'poi'}));
  } catch (e) { showErr('施設の検索に失敗しました（' + e.message + '）。住所の検索で探します'); }
  if (!feats.length) {
    const j = await (await fetch('https://api.mapbox.com/search/geocode/v6/forward?' + qs.replace('limit=7', 'limit=5'))).json();
    feats = (j.features || []).map(f => ({p: f.geometry.coordinates, name: f.properties.name || '',
      sub: f.properties.full_address || f.properties.place_formatted || '', poi: false}));
  }
  return feats;
}
$('searchBtn').onclick = async () => {
  const q = $('search').value.trim(); if (!q) return;
  $('hits').innerHTML = '<div class="small">検索中…</div>';
  try {
    const feats = await searchPlaces(q); $('hits').innerHTML = '';
    feats.forEach(f => {
      const d = document.createElement('div'); d.className = 'hit';
      const b = document.createElement('b'); b.textContent = (f.poi ? '📍' : '') + f.name;
      const sm = document.createElement('div'); sm.className = 'small';
      sm.textContent = f.sub && f.sub !== f.name ? f.sub : '';
      d.append(b, sm);
      d.onclick = () => { setDest(f.p); $('hits').innerHTML = ''; };
      $('hits').appendChild(d);
    });
    if (!feats.length) $('hits').textContent = '見つかりませんでした。住所で試すか「地図で指定」を使ってください。';
  } catch (e) { $('hits').innerHTML = ''; showErr('検索エラー：' + e.message); }
};
$('search').addEventListener('keydown', e => { if (e.key === 'Enter') $('searchBtn').click(); });
function setDest(p) {
  dest = p; preferGeneral = false; viaEntry = null;
  if (destMarker) destMarker.remove();
  destMarker = new mapboxgl.Marker({color: '#c0392b'}).setLngLat(p).addTo(map);
  $('guide').textContent = '目的地を設定しました。「ナビ開始」を押してください。';
  if (!navOn) $('start').disabled = false; else { active = null; compare(); }
}

// ---------- 経路取得 ----------
async function api(list, extra) {
  if (reqCount >= MAX_REQ) throw new Error('利用回数の上限に達しました（再読み込みでリセット）');
  reqCount++; $('counter').textContent = `API利用 ${reqCount}回`;
  const c = list.map(p => p[0].toFixed(6) + ',' + p[1].toFixed(6)).join(';');

    } else if (active) {

// ---------- OpenStreetMap（Overpass）の取得：3か所に同時に頼み、最初に返ってきた答えを使う ----------
const OVERPASS = [['https://overpass-api.de/api/interpreter', '本家'],
  ['https://maps.mail.ru/osm/tools/overpass/api/interpreter', 'VK'],

async function overpass(q) {
  const reasons = [];

    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 25000);
    try {
      const r = await fetch(u, {method:'POST', body:'data=' + encodeURIComponent(q),
        headers:{'Content-Type':'application/x-www-form-urlencoded'}, signal: ctl.signal});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      let j; try { j = await r.json(); } catch (e) { throw new Error('応答が壊れていた'); }
      if (j.remark && /error/i.test(j.remark)) throw new Error('混雑で打ち切り');

      throw e;

// ---------- 出口の自動取得（OpenStreetMap）＋登録済み ----------
async function findExits(my) {

    .forEach(x => res.push({name: x.ic.name, E: x.ic.p, a: x.a}));
  try {
    const pts = []; let next = my;
    for (let i = 0; i < active.coords.length; i++) {
      const a = active.cum[i];

      if (a >= next) { pts.push(active.coords[i]); next = a + 1000; }
    }
    if (pts.length >= 2) {
      const ll = pts.map(p => p[1].toFixed(5) + ',' + p[0].toFixed(5)).join(',');
      const q = `[out:json][timeout:15];(node["highway"="motorway_junction"](around:150,${ll});node["barrier"="toll_booth"](around:2000,${ll}););out body;`;
      const els = await overpass(q);
      const booths = els.filter(e => e.tags && e.tags.barrier === 'toll_booth')
        .map(e => [e.lon, e.lat]).filter(p => nearest(active.coords, p).d > 40);
      els.filter(e => e.tags && e.tags.highway === 'motorway_junction').forEach(jn => {
        const p = [jn.lon, jn.lat], a = active.cum[nearest(active.coords, p).i] - my;
        if (a < 300 || a > 40000) return;
        let best = null;
        booths.forEach(b => { const d = distM(p, b); if (d < 1500 && (!best || d < best.d)) best = {b, d}; });
        if (!best) return;
        const name = jn.tags.name || jn.tags.ref || '出口';
        if (res.some(x => Math.abs(x.a - a) < 1500 || x.name === name)) return;
        res.push({name, E: best.b, a});

  } catch (e) { showErr('出口の自動取得に失敗しました（' + e.message + '）。登録済みの出口とMapboxの代替で判定します'); }
  return res.sort((x, y) => x.a - y.a).slice(0, 3);
}

// ---------- 乗るIC（入口）の自動取得（OpenStreetMap）＋登録済み ----------
function entryName(n) {

  if (!/(IC|ＩＣ|インター|入口|ランプ)$/.test(n)) n += 'IC';

// 料金所・IC・JCT・SA・PAの位置は 0.25度（約25km）のマスごとに端末に保存し、90日は取り直さない
const OSM_KEY = 'navi_osm_v1', ENT_T = 0.25, ENT_DAYS = 90, ENT_MAX = 80;
let entCache = {};
try { entCache = JSON.parse(localStorage.getItem(OSM_KEY) || '{}') || {}; localStorage.removeItem('navi_entry_v1'); } catch (e) { entCache = {}; }
function saveEntCache() {
  const keys = Object.keys(entCache).sort((a, b) => entCache[a].t - entCache[b].t);
  while (keys.length > ENT_MAX) delete entCache[keys.shift()];
  for (let k = 0; k < 5; k++) {
    try { localStorage.setItem(OSM_KEY, JSON.stringify(entCache)); return; }
    catch (e) { const old = keys.shift(); if (!old) return; delete entCache[old]; }

}
const tileOf = p => Math.floor(p[0] / ENT_T) + ',' + Math.floor(p[1] / ENT_T);
// マス（"x,y" の一覧）のデータを返す。足りないマスだけ Overpass で取る
async function loadTiles(keys) {
  const now = Date.now();
  const need = keys.filter(k => { const t = entCache[k]; return !t || now - t.t > ENT_DAYS * 864e5; });
  let err = null;
  if (need.length) {
    const bbs = need.map(k => { const [x, y] = k.split(',').map(Number);
      return [y * ENT_T, x * ENT_T, (y + 1) * ENT_T, (x + 1) * ENT_T].map(v => v.toFixed(3)).join(','); });
    const u = f => '(' + bbs.map(bb => f + '(' + bb + ');').join('') + ')';
    // 料金所（本線上の料金所は除く）、IC・JCTの分かれ目、SA・PA
    const q = `[out:json][timeout:25];${u('node["barrier"="toll_booth"]')}->.b;way(bn.b)["highway"="motorway"]->.m;(.b; - node(w.m););out body;`
      + `${u('node["highway"="motorway_junction"]')};out body;${u('nwr["highway"~"^(services|rest_area)$"]')};out center;`;
    try {
      const els = await overpass(q);
      const fresh = {};
      need.forEach(k => fresh[k] = {t: now, b: [], j: [], s: []});
      els.forEach(e => {
        if (!e.tags) return;
        const lon = e.lon !== undefined ? e.lon : e.center && e.center.lon, lat = e.lat !== undefined ? e.lat : e.center && e.center.lat;
        if (lon === undefined) return;
        const t = fresh[tileOf([lon, lat])]; if (!t) return;
        const ll = [Number(lon.toFixed(5)), Number(lat.toFixed(5))];
        if (e.tags.barrier === 'toll_booth') t.b.push([ll[0], ll[1], e.tags.name || '']);
        else if (e.tags.highway === 'motorway_junction' && (e.tags.name || e.tags.ref)) t.j.push([ll[0], ll[1], e.tags.name || e.tags.ref]);
        else if (e.tags.highway === 'services' || e.tags.highway === 'rest_area')
          t.s.push([ll[0], ll[1], e.tags.name || '', e.tags.highway === 'services' ? 'SA' : 'PA']);
      });
      Object.assign(entCache, fresh); saveEntCache();
    } catch (e) { err = e; }
  }
  const b = [], j = [], sv = [];
  keys.forEach(k => { const t = entCache[k]; if (t) { b.push(...t.b); j.push(...t.j); sv.push(...(t.s || [])); } });
  return {b, j, s: sv, err, missing: keys.filter(k => !entCache[k]).length};
}
async function loadEntryTiles(R) {
  const dLat = R / 110540, dLon = R / (111320 * Math.cos(pos[1] * Math.PI / 180));
  const x0 = Math.floor((pos[0] - dLon) / ENT_T), x1 = Math.floor((pos[0] + dLon) / ENT_T);
  const y0 = Math.floor((pos[1] - dLat) / ENT_T), y1 = Math.floor((pos[1] + dLat) / ENT_T);
  const keys = [];
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) keys.push(x + ',' + y);
  return loadTiles(keys);

// ---------- ハイウェイモード：この先のIC・JCT・SA・PA ----------
let facBusy = false, facFailAt = 0;
function facName(n, type) {
  n = (n || '').trim().replace(/[（(][^）)]*[上下]り[^）)]*[）)]/g, '').replace(/サービスエリア/g, 'SA').replace(/パーキングエリア/g, 'PA').replace(/ジャンクション/g, 'JCT').trim();
  if (type === 'IC' && !/(IC|ＩＣ|インター|出口|入口|ランプ)$/.test(n)) n += 'IC';
  if ((type === 'SA' || type === 'PA') && !/(SA|PA|ハイウェイオアシス)$/.test(n)) n += type;
  return n;
}
// 進行方向に対して左側なら正（日本は左側通行なので、自分の側のSA・PAは左にある）
function sideOf(c, i, p) {
  const a = c.coords[i], b = c.coords[i + 1] || a, k = Math.cos(a[1] * Math.PI / 180);
  const vx = (b[0] - a[0]) * k, vy = b[1] - a[1], wx = (p[0] - a[0]) * k, wy = p[1] - a[1];
  return vx * wy - vy * wx;
}
function buildFacilities(c, data) {
  const list = [];
  const add = (type, name, p, a) => {
    if (!name || a < 0) return;
    if (list.some(x => (x.name === name && Math.abs(x.a - a) < 3000) || (x.type === type && Math.abs(x.a - a) < 700))) return;
    list.push({type, name, p, a});
  };
  const onMw = i => c.mw && c.mw[i];
  data.j.forEach(v => {
    const p = [v[0], v[1]], n = nearest(c.coords, p);
    if (!onMw(n.i)) return;
    // 分かれ目は自分の車線の上にある。少し離れていて右側なら反対車線のものなので除く
    if (n.d > 60 || (n.d > 12 && sideOf(c, n.i, p) < 0)) return;
    const raw = v[2], type = /JCT|ジャンクション/.test(raw) ? 'JCT' : /SA|サービスエリア/.test(raw) ? 'SA' : /PA|パーキングエリア/.test(raw) ? 'PA' : 'IC';
    add(type, facName(raw, type), p, c.cum[n.i] + n.t * (c.cum[n.i + 1] - c.cum[n.i]));
  });
  data.s.forEach(v => {
    const p = [v[0], v[1]], n = nearest(c.coords, p);
    if (!onMw(n.i) || n.d > 500 || sideOf(c, n.i, p) < 0) return;
    add(v[3], facName(v[2], v[3]), p, c.cum[n.i] + n.t * (c.cum[n.i + 1] - c.cum[n.i]));
  });

  c.steps.forEach(st => (st.intersections || []).forEach(x => {
    const rs = x.rest_stop, tc = x.toll_collection;
    if (rs && rs.name) { const type = rs.type === 'service_area' ? 'SA' : 'PA'; add(type, facName(rs.name, type), x.location, along(c, x.location)); }
    if (tc && tc.type === 'toll_booth' && (x.classes || []).includes('motorway')) add('料金所', facName(tc.name || '本線料金所', ''), x.location, along(c, x.location));
  }));
  return list.sort((x, y) => x.a - y.a);
}
async function prepFacilities(c) {
  c.steps = c.steps || (c.r.legs[0] && c.r.legs[0].steps) || [];
  // 区間ごとに高速道路かどうか
  c.mw = new Array(c.coords.length).fill(false);
  let any = false;
  c.steps.forEach(st => { if (!isMwStep(st)) return; any = true;
    const a0 = along(c, st.maneuver.location), a1 = a0 + (st.distance || 0);
    for (let i = 0; i < c.coords.length; i++) if (c.cum[i] >= a0 - 30 && c.cum[i] <= a1 + 30) c.mw[i] = true; });
  if (!any) { c.fac = []; return; }
  const keys = []; let next = 0;
  for (let i = 0; i < c.coords.length; i++) if (c.mw[i] && c.cum[i] >= next) { const k = tileOf(c.coords[i]); if (!keys.includes(k)) keys.push(k); next = c.cum[i] + 2000; }
  const ready = keys.every(k => entCache[k]);
  if (ready || facBusy || Date.now() - facFailAt < 5 * 60000) {
    c.fac = buildFacilities(c, await loadTiles(keys.filter(k => entCache[k])));
    return;
  }
  facBusy = true;
  try {
    const data = await loadTiles(keys);
    if (data.err) { facFailAt = Date.now(); showErr('IC・SA・PAの取得に失敗しました（' + data.err.message + '）。経路データにある分だけ表示します'); }
    c.fac = buildFacilities(c, data);

function facLabel(t) { return {IC: 'IC', JCT: 'JCT', SA: 'SA', PA: 'PA', '料金所': '料金'}[t] || t; }
const FAC_COLOR = {IC: '#1f3a93', JCT: '#6c3483', SA: '#2e7d32', PA: '#558b2f', '料金所': '#7f8c8d'};
function readName(n) { return n.replace(/SA$/, 'サービスエリア').replace(/PA$/, 'パーキングエリア').replace(/JCT$/, 'ジャンクション').replace(/IC$/, 'インターチェンジ'); }

    const g = c.cong[i]; if (g === 'heavy' || g === 'severe') j += Math.min(c.cum[i + 1], a2) - Math.max(c.cum[i], a1);

function renderHighway(my, onMw) {

  const ahead = onMw && active.fac ? active.fac.filter(f => f.a > my + 50).slice(0, 5) : [];
  if (!ahead.length) { box.style.display = 'none'; return; }
  const t0 = timeAt(active, my);
  let h = '', prev = my;
  ahead.forEach(f => {
    const jam = jamBetween(active, prev, f.a);
    if (jam >= 300) h += `<div class="jam">▲ 渋滞 ${(jam / 1000).toFixed(1)}km</div>`;
    h += `<div class="fac"><span class="t" style="background:${FAC_COLOR[f.type] || '#555'}">${facLabel(f.type)}</span>`
      + `<span class="n">${f.name}</span><span class="d">${fmtDist(f.a - my)}　${hhmm(timeAt(active, f.a) - t0)}</span></div>`;
    prev = f.a;
  });
  box.innerHTML = h; box.style.display = 'block';
  // SA・PA・JCTは2km手前で読み上げ
  const f = ahead.find(x => (x.type === 'SA' || x.type === 'PA' || x.type === 'JCT') && x.a - my <= 2000 && x.a - my > 300);
  if (f && !spokenFac.has(f.name)) { spokenFac.add(f.name); speak(`この先${fmtDist(f.a - my)}、${readName(f.name)}です`); }
}

async function findEntries() {
  const D = distM(pos, dest);
  if (D < 10000) return [];
  // 目的地へ向かう方向にあるものだけ（大きく逆戻りする入口は除く）
  const ok = p => distM(pos, p) + distM(p, dest) <= D * 1.25 + 2000;
  const groups = [];
  ics.forEach(ic => { if (ok(ic.p)) groups.push({name: ic.name, c: ic.p, pts: [ic.p]}); });
  const R = Math.round(Math.min(25000, Math.max(8000, D * 0.4)));
  const tiles = await loadEntryTiles(R);
  if (tiles.err) showErr('入口（IC）の自動取得に失敗しました（' + tiles.err.message + '）。'
    + (tiles.missing ? '登録済みの出口とMapboxの代替で比べます' : '前回保存した分で比べます'));
  const jns = tiles.j.filter(v => !isJct(v[2])).map(v => ({p: [v[0], v[1]], name: v[2]}));
  const osm = [];
  tiles.b.forEach(v => {
    const p = [v[0], v[1]]; if (distM(pos, p) > R || !ok(p)) return;
    let g = osm.find(x => x.pts.some(q2 => distM(q2, p) < 600));
    if (!g) {
      let jn = null; jns.forEach(x => { const d = distM(x.p, p); if (d < 2500 && (!jn || d < jn.d)) jn = {name: x.name, d}; });
      g = {name: entryName(jn ? jn.name : v[2].replace(/料金所$/, '')), c: p, pts: []}; osm.push(g);
    }
    if (g.pts.every(q2 => distM(q2, p) > 30)) g.pts.push(p);
  });
  osm.forEach(g => {
    if (g.name === 'IC') g.name = '名前のない入口';
    const same = groups.find(x => x.name === g.name || distM(x.c, g.c) < 1500);
    if (same) { g.pts.forEach(p => { if (same.pts.length < 3) same.pts.push(p); }); return; }
    groups.push(g);
  });
  // 近くて、目的地への回り道が少ないものから最大5か所
  const score = g => { const a = distM(pos, g.c); return a + 2 * (a + distM(g.c, dest) - D); };
  return groups.sort((x, y) => score(x) - score(y)).slice(0, 5);
}
const isJct = n => /JCT|ジャンクション/.test(n || '');
// ルートが初めて高速道路に入る地点（道のりの距離）。高速を使わないなら -1
function mwStartAlong(c) {
  const st = (c.r.legs[0] && c.r.legs[0].steps) || [];
  for (const s of st) for (const x of (s.intersections || []))
    if ((x.classes || []).includes('motorway')) return along(c, x.location);
  return -1;
}
async function entryCands() {
  const groups = await findEntries();
  let calls = 0; const MAX_CALLS = 8;
  const res = await Promise.all(groups.map(async g => {
    for (const p of g.pts.slice(0, 2)) {
      if (calls >= MAX_CALLS) return null;
      calls++;
      const r = await api([pos, p, dest], '&waypoints=0;2').then(x => x[0]).catch(() => null);
      if (!r) continue;
      const c = prep(r, g.name + 'から乗る');
      const ap = along(c, p), am = mwStartAlong(c);
      // 本当にその入口から高速に入っているものだけ残す（逆向きの車線に吸い寄せられた経路などは捨てる）
      if (nearest(c.coords, p).d > 300 || am < 0 || Math.abs(am - ap) > 2500) continue;
      return {name: g.name, p, c, ap};
    }
    return null;
  }));
  return res.filter(Boolean).map(x => ({
    label: `${x.name}から乗る（入口まで${fmtDist(x.ap)}）`, entry: true, name: x.name,
    dur: x.c.r.duration, dist: x.c.r.distance, geom: x.c.coords, pc: x.c,
    act: () => { setActive(x.c); viaEntry = {p: x.p, name: x.name}; }
  }));
}

// ---------- 判定 ----------
async function judge(auto, withEntry) {
  if (!navOn || !active || !pos || !dest) { if (!auto) $('judgeOut').innerHTML = '<div class="small">ナビ開始後に使えます</div>'; return; }
  if (judging) return;
  if (active.icLeg) { if (!auto) $('judgeOut').innerHTML = '<div class="small">出口を出るまでは判定を止めています</div>'; return; }
  judging = true; lastJudge = Date.now();
  $('judgeOut').innerHTML = '<div class="small">判定中…</div>';
  try {
    const my = along(active, pos), st = active.steps[curStepIdx(my)];
    const onMw = st ? isMwStep(st) : false;
    const we = !onMw && (withEntry || entryPending);
    let cands = onMw ? await highwayCands(my) : await generalCands(my, we);
    const uniq = [];
    cands.forEach(x => { if (x.pc && uniq.some(y => y.pc && sameAs(x.pc, y.pc))) return; uniq.push(x); });
    let note = onMw ? '高速道路上の判定' : '一般道上の判定';
    if (we) note += '（乗るICの比較を含む）';
    if (!onMw && cands.noJam) note += '（この先15km以内に渋滞がないため、迂回候補は作っていません）';
    decide(uniq, auto, note, cands.curEntry);
  } finally { judging = false; }
}
async function highwayCands(my) {
  const cands = [];
  const altP = api([pos, dest], '&alternatives=true').then(rs => rs.map(r => prep(r, ''))).catch(e => { showErr(e.message); return []; });
  const exits = await findExits(my);
  const exP = Promise.all(exits.map(async ex => {
    const [toE, after, rej] = await Promise.all([
      api([pos, ex.E], '').then(r => r[0]).catch(() => null),
      api([ex.E, dest], '&exclude=motorway').then(r => r[0]).catch(() => null),
      api([pos, ex.E, dest], '&waypoints=0;2').then(r => r[0]).catch(() => null)
    ]);
    return {ex, toE, after, rej};
  }));
  const [alts, exRes] = await Promise.all([altP, exP]);
  exRes.forEach(({ex, toE, after, rej}) => {
    if (!toE || toE.distance > ex.a + 5000) return; // 逆方向の出口などは除外
    if (after) cands.push({
      label: `${ex.name}で降りて一般道（あと${fmtDist(ex.a)}）`,
      dur: toE.duration + after.duration, dist: toE.distance + after.distance,
      geom: toE.geometry.coordinates.concat(after.geometry.coordinates),
      act: () => { const c = prep(toE, `${ex.name}で降りる`); c.icLeg = true; setActive(c); preferGeneral = true; }
    });
    if (rej) {
      const c = prep(rej, `${ex.name}で降りる（その後おまかせ）`);
      cands.push({label: `${ex.name}で降りて、その後おまかせ（乗り直しを含む）`, dur: rej.duration, dist: rej.distance,
        geom: c.coords, act: () => setActive(c), pc: c});
    }
  });
  alts.forEach(c => {
    if (sameAs(c, active)) return;
    const early = earlyExit(c, my);
    c.name = early ? '早めに降りる案' : '別の高速ルート';
    cands.push({label: early ? `早めに降りる案（${early}）` : '別の高速ルート', dur: c.r.duration, dist: c.r.distance,
      geom: c.coords, act: () => setActive(c), pc: c});
  });
  return cands;
}
async function generalCands(my, withEntry) {
  const cands = [];
  if (withEntry) entryPending = false;
  const entP = withEntry ? entryCands().catch(e => { showErr(e.message); return []; }) : Promise.resolve([]);
  const altP = api([pos, dest], '&alternatives=true').then(rs => rs.map(r => prep(r, ''))).catch(e => { showErr(e.message); return []; });
  let detP = Promise.resolve([]);
  const jam = jamSpan(my);
  if (jam) {
    const a = active.coords[jam.i1], b = active.coords[jam.i2], mid = active.coords[Math.floor((jam.i1 + jam.i2) / 2)];
    const brg = bearing(a, b);
    const offs = [[-90, 1500, '左'], [-90, 3000, '左'], [90, 1500, '右'], [90, 3000, '右']];
    detP = Promise.all(offs.map(([d, dist, side]) =>
      api([pos, offsetPt(mid, brg + d, dist), dest], '&waypoints=0;2')
        .then(r => ({c: prep(r[0], `${side}側へ迂回`), label: `渋滞を${side}側へ迂回（${dist / 1000}km外側）`}))
        .catch(() => null)));
  }
  const [alts, dets, ents] = await Promise.all([altP, detP, entP]);
  ents.forEach(x => {
    if (sameAs(x.pc, active)) { cands.curEntry = x.name; return; }
    cands.push(x);
  });
  alts.forEach(c => {
    if (sameAs(c, active)) return;
    const usesMw = ((c.r.legs[0] && c.r.legs[0].steps) || []).some(isMwStep);
    c.name = usesMw ? '高速に戻る' : '代替ルート';
    cands.push({label: c.name, dur: c.r.duration, dist: c.r.distance, geom: c.coords, act: () => setActive(c), pc: c});
  });
  dets.forEach(x => {
    if (!x || sameAs(x.c, active)) return;
    cands.push({label: x.label, dur: x.c.r.duration, dist: x.c.r.distance, geom: x.c.coords, act: () => setActive(x.c), pc: x.c});
  });
  if (!jam) cands.noJam = true;
  return cands;
}
function decide(cands, auto, note, curEntry) {
  const thr = Number($('thr').value), w = wkm();
  const curDur = remDur(active), curDist = remDist(active);
  cands.forEach(c => { c.tGain = (curDur - c.dur) / 60; c.dKm = (c.dist - curDist) / 1000; c.sGain = c.tGain - w * c.dKm; });
  cands.sort((a, b) => b.sGain - a.sGain);
  const best = cands[0];
  let verdict, say, recommend = false;
  if (best && best.sGain >= thr) {
    recommend = true;
    verdict = `判定：${best.label}が有利。このままより約${Math.round(best.tGain)}分早く、距離${fmtKm(best.dKm)}（実質${Math.round(best.sGain)}分有利）`;
    say = `${best.label.replace(/（.*?）/g, '')}${best.entry ? '案' : ''}が有利です。約${Math.round(best.tGain)}分早く着きます`;
    setData('prop', [{type:'Feature', properties:{}, geometry:{type:'LineString', coordinates: best.geom}}]);
  } else {
    verdict = '判定：差はわずかです。このままで問題ありません';
    say = 'このままで問題ありません';
    setData('prop', []);
  }
  let h = `<div id="verdict">${verdict}</div>
    <div class="small">${note}</div>
    <div class="card cur"><b>このまま</b>（${active.name}${curEntry ? '・' + curEntry + 'から乗る' : ''}）<br>到着 ${hhmm(curDur)}　残り${(curDist / 1000).toFixed(1)}km</div>`;
  cands.forEach((c, i) => {
    const g = Math.round(c.sGain);
    h += `<div class="card"><b>${c.label}</b><br>
      到着 ${hhmm(c.dur)}（${sgn(-Math.round(c.tGain))}分、距離${fmtKm(c.dKm)}）<br>
      実質 ${g >= 0 ? g + '分有利' : -g + '分不利'}　<button data-c="${i}">この案で行く</button></div>`;
  });
  if (!cands.length) h += '<div class="small">比べられる候補が見つかりませんでした</div>';
  $('judgeOut').innerHTML = h;
  $('judgeOut').querySelectorAll('button[data-c]').forEach(b => b.onclick = () => {
    viaEntry = null; cands[Number(b.dataset.c)].act(); hideBanner(); speak('ルートを切り替えました');
    $('judgeOut').innerHTML = '<div class="small">切り替えました</div>';
  });
  if (!auto || recommend) speak(say);
}
$('judgeBtn').onclick = () => judge(false, true);

// ---------- 走行中の案内 ----------
function guide() {
  if (!active || !pos) return;
  const n = nearest(active.coords, pos);
  if (n.d > 50) { offCount++; if (offCount >= 3 && !busy) { offCount = 0; speak('ルートを外れました。再検索します'); active = null; compare(); return; } }
  else offCount = 0;
  const my = along(active, pos), rem = totalOf(active) - my;
  if (active.icLeg && rem < 150) { active = null; speak('一般道のルートで案内を続けます'); compare(); return; }
  if (rem < 40) { speak('目的地に到着しました'); stopNav(); $('next').textContent = '到着しました'; return; }
  const rd = remDur(active);
  $('summary').textContent = `到着 ${hhmm(rd)}　残り ${Math.round(rd / 60)}分・${fmtDist(rem)}`;

  const exits = exitsAhead(my);
  $('exitInfo').textContent = exits.length ? `次の出口：${exits[0].ic.name}　あと${fmtDist(exits[0].a)}` : '';
  if (viaEntry) {
    const vn = nearest(active.coords, viaEntry.p), va = active.cum[vn.i] - my;
    // 入口を通り過ぎた、または別のルートに切り替えたら、入口の指定を外す
    if (vn.d > 300 || va < -300) viaEntry = null;
    else $('exitInfo').textContent = `乗る入口：${viaEntry.name}　あと${fmtDist(va)}`;
  }

  const st0 = active.steps[curStepIdx(my)];
  renderHighway(my, st0 ? isMwStep(st0) : false);

  const k = curStepIdx(my) + 1;
  if (k >= active.steps.length || !(active.manAlong[k] > my + 5)) $('next').textContent = '目的地まで道なりです';
  else {
    const st = active.steps[k], dist = active.manAlong[k] - my, ins = st.maneuver.instruction || '';
    $('next').textContent = `${fmtDist(dist)}先　${ins}`;
    const key = st.maneuver.location.map(v => v.toFixed(4)).join(',');
    const far = (speed && speed > 20) ? 1000 : 300;
    if (dist <= far && dist > 120 && !spoken.has(key + 'f')) { spoken.add(key + 'f'); speak(`${fmtDist(dist)}先、${ins}`); }
    if (dist <= 80 && !spoken.has(key + 'n')) { spoken.add(key + 'n'); speak(ins); }
  }

  let h = '';
  active.incs.forEach(x => {
    const ahead = (active.cum[x.geometry_index_start || 0] || 0) - my;
    if (ahead < -50) return;
    const label = INC[x.type] || x.type;
    const pre = exits.filter(e => e.a < ahead).pop();
    const preTxt = pre ? `<br>　手前の出口：${pre.ic.name}（あと${fmtDist(pre.a)}）` : '';
    h += `<div class="inc">● ${label}：${fmtDist(ahead)}先　${x.description || ''}${x.closed ? '（通行止め）' : ''}${preTxt}</div>`;
    if (ahead < 10000 && !spokenInc.has(x.id)) {
      spokenInc.add(x.id);
      speak(`この先${fmtDist(ahead)}で、${label}の情報があります` + (pre ? `。手前の出口は${pre.ic.name}です` : ''));
    }
  });
  $('incs').innerHTML = h || '<span class="small">ルート上の事故・規制情報なし</span>';
}

// ---------- 開始・停止 ----------
function restartTimer() { clearInterval(timer); timer = setInterval(compare, Number($('interval').value) * 60000); }
$('interval').onchange = () => { if (navOn) restartTimer(); };
$('start').onclick = async () => {
  if (!pos) { showErr('現在地がまだ取得できていません。少し待ってから押してください。'); return; }
  if (!dest) return;
  navOn = true; follow = true; preferGeneral = false; viaEntry = null; entryPending = true; $('followBtn').textContent = '追従：ON';
  $('start').disabled = true; $('stop').disabled = false; $('judgeOut').innerHTML = '';
  speak('ナビを開始します'); keepAwake();
  map.easeTo({center: pos, zoom: 15});
  active = null; await compare(); restartTimer();
  if (active && !judging) judge(true);
};
function stopNav() {
  navOn = false; clearInterval(timer); viaEntry = null; entryPending = false;
  try { if (wakeLock) wakeLock.release(); } catch (e) {}
  hideBanner(); $('start').disabled = !dest; $('stop').disabled = true; $('hwy').style.display = 'none';
  $('exitInfo').textContent = ''; $('status').textContent = '停止中';
}
$('stop').onclick = () => { stopNav(); speak('ナビを終了します'); };
$('followBtn').onclick = () => {
  follow = !follow; $('followBtn').textContent = follow ? '追従：ON' : '追従：OFF';
  if (follow && pos) map.easeTo({center: pos});
};
</script>
</body>
