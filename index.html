<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>KomuMiru</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="description" content="渋滞を見ながら、高速のまま・降りる・別の入口から乗るを比べる自分用カーナビ">
<meta name="theme-color" content="#1f3a93">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<!-- iPhone でホーム画面に追加したとき用 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KomuMiru">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div id="top"><span id="appName">KomuMiru</span><button class="q" data-q="app">？</button><label class="helpSw"><input type="checkbox" id="helpChk">使い方ナビ</label></div>
  <div id="tip"><div id="tipText"></div><div id="tipWarn"></div><button class="x" id="tipX" aria-label="閉じる">×</button></div>
  <div id="next">目的地を設定してください</div>
  <div id="summary"></div>
  <div id="exitInfo"></div>
  <div id="hwy"></div>
  <div id="banner">
    <div id="bannerText"></div>
    <button id="switchBtn">切り替える</button><button id="ignoreBtn">今回は見送る</button>
  </div>
  <div>
    <button id="start" disabled>ナビ開始</button><button id="stop" disabled>停止</button><button id="judgeBtn">判定</button><button id="followBtn">追従：ON</button><button class="q" data-q="buttons">？</button>
  </div>
  <div id="searchRow">
    <input id="search" placeholder="目的地（住所・駅名など）"><button id="searchBtn">検索</button><button id="pickBtn">地図で指定</button>
  </div>
  <div id="hits"></div>
  <div id="guide" class="small">現在地を取得中…</div>
  <div id="judgeOut"></div>
  <div id="incs"></div>
  <div id="cands"></div>
  <div class="small" id="settings"><button class="q" data-q="settings">？</button>
    提案する差：<select id="thr"><option>2</option><option selected>3</option><option>5</option><option>10</option></select>分以上
    　確認間隔：<select id="interval"><option>1</option><option selected>2</option><option>3</option><option>5</option></select>分<br>
    遠回り1km＝<select id="wkm"><option>0</option><option>0.5</option><option selected>1</option><option>2</option></select>分の損とみなす
  </div>
  <details>
    <summary>出口（IC）の登録<button class="q" data-q="ics">？</button></summary>
    <div class="small">出口は地図データから自動で拾いますが、確実にしたい出口は登録できます。「出口を登録」を押し、<b>料金所を出た先の一般道</b>をタップして名前を付けてください。</div>
    <button id="icAddBtn">出口を登録</button>
    <div id="icList"></div>
    <div class="small">端末間で移すとき：書き出し → 文字をコピー → 別の端末に貼って読み込み</div>
    <textarea id="icText" rows="3" style="width:100%"></textarea>
    <button id="icExport">書き出し</button><button id="icImport">読み込み</button>
  </details>
  <div class="small"><span id="status"></span>　<span id="counter">API利用 0回</span><button class="q" data-q="status">？</button></div>
  <div id="err" class="small" style="color:#c00"></div>
  <div class="small">出口データ © OpenStreetMap contributors</div>
</div>
<script src="core.js?v=1"></script>
<script src="osm.js?v=1"></script>
<script src="route.js?v=1"></script>
<script src="nav.js?v=1"></script>
<script src="help.js?v=1"></script>
<script src="main.js?v=1"></script>
</body>
</html>
